name: Bean Mod Manager Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.6.2)"
        required: true

# Required for creating GitHub Releases with the built-in GITHUB_TOKEN
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    env:
      SOLUTION: BeanModManager.sln
      ARCHES: "x86 x64 arm64"

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # --------------------------------------------
    # Resolve version (tag push or manual input)
    # --------------------------------------------
    - name: Get version
      id: version
      shell: pwsh
      run: |
        if ("${{ github.event_name }}" -eq "workflow_dispatch") {
          $version = "${{ inputs.version }}".TrimStart("v")
        } else {
          $version = "${{ github.ref_name }}".TrimStart("v")
        }
        if (-not $version) { Write-Error "No version resolved"; exit 1 }
        Add-Content -Path $env:GITHUB_ENV -Value "VERSION=$version"
        Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"
        Write-Host "Version: $version"

    # --------------------------------------------
    # Setup .NET (for NuGet restore tooling if needed)
    # --------------------------------------------
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    # --------------------------------------------
    # Install WiX CLI (required by WixSharp to build MSI)
    # --------------------------------------------
    - name: Install WiX tool
      shell: pwsh
      run: |
        dotnet tool install --global wix
        Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.dotnet\tools"
        wix eula accept wix7
        wix --version

    # --------------------------------------------
    # Setup MSBuild (Visual Studio) for .NET Framework builds
    # --------------------------------------------
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # --------------------------------------------
    # Restore once for the whole solution
    # --------------------------------------------
    - name: Restore
      shell: pwsh
      run: |
        msbuild -version
        msbuild $env:SOLUTION /t:Restore /p:RestoreLockedMode=false

    # --------------------------------------------
    # Build app + MSI for each architecture
    # --------------------------------------------
    - name: Build all architectures
      shell: pwsh
      run: |
        $version = "${{ steps.version.outputs.version }}"
        foreach ($arch in $env:ARCHES.Split(" ")) {
          Write-Host "=== Building $arch ==="
          $outDir = "bin\Release-$arch"

          msbuild BeanModManager.csproj `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=AnyCPU `
            /p:PlatformTarget=$arch `
            /p:OutputPath="$outDir\" `
            /p:Version=$version `
            /p:AssemblyVersion=$version `
            /p:FileVersion=$version
          if ($LASTEXITCODE -ne 0) { Write-Error "App build failed for $arch"; exit 1 }

          New-Item -ItemType Directory -Force -Path "publish/portable-$arch" | Out-Null
          Copy-Item -Path "$outDir\BeanModManager.exe" -Destination "publish/portable-$arch\BeanModManager.exe"

          $env:ARCH = $arch
          $env:SOURCE_DIR = "..\$outDir"
          $env:VERSION = $version
          msbuild Setup\Setup.csproj `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=AnyCPU `
            /p:Version=$version
          if ($LASTEXITCODE -ne 0) { Write-Error "MSI build failed for $arch"; exit 1 }
        }

    # --------------------------------------------
    # Verify all MSIs exist
    # --------------------------------------------
    - name: Verify MSIs
      shell: pwsh
      run: |
        foreach ($arch in $env:ARCHES.Split(" ")) {
          $msi = "Setup/Bean Mod Manager-$arch.msi"
          if (!(Test-Path $msi)) {
            Write-Error "MSI not found at $msi"
          }
        }

    # --------------------------------------------
    # Decode signing cert
    # --------------------------------------------
    - name: Validate code signing secrets
      shell: pwsh
      run: |
        if ("${{ secrets.CODESIGN_PFX }}" -eq "") {
          Write-Error "Missing GitHub Actions secret: CODESIGN_PFX (base64-encoded .pfx). Set it in repo Settings -> Secrets and variables -> Actions."
          exit 1
        }
        if ("${{ secrets.CODESIGN_PASSWORD }}" -eq "") {
          Write-Error "Missing GitHub Actions secret: CODESIGN_PASSWORD. Set it in repo Settings -> Secrets and variables -> Actions."
          exit 1
        }

    - name: Locate signtool.exe
      shell: pwsh
      run: |
        $candidates = @()

        $kitsRoot = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
        if (Test-Path $kitsRoot) { $candidates += Get-ChildItem -Path $kitsRoot -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue }

        $sdkRoot = "${env:ProgramFiles(x86)}\Microsoft SDKs"
        if (Test-Path $sdkRoot) { $candidates += Get-ChildItem -Path $sdkRoot -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue }

        $signtool = $candidates |
          Sort-Object @{ Expression = { $_.FullName -match "\\x64\\signtool\.exe$" }; Descending = $true }, `
                     @{ Expression = { $_.FullName }; Descending = $true } |
          Select-Object -First 1

        if (-not $signtool -or -not (Test-Path $signtool.FullName)) {
          Write-Error "signtool.exe not found on runner."
          exit 1
        }

        Write-Host "Found signtool: $($signtool.FullName)"
        Add-Content -Path $env:GITHUB_PATH -Value $signtool.Directory.FullName
        Add-Content -Path $env:GITHUB_ENV -Value "SIGNTOOL=$($signtool.FullName)"
        & $signtool.FullName /?

    - name: Decode code signing certificate
      shell: pwsh
      run: |
        $b64 = "${{ secrets.CODESIGN_PFX }}"
        $bytes = [Convert]::FromBase64String($b64)
        if (-not $bytes -or $bytes.Length -lt 64) {
          Write-Error "CODESIGN_PFX decoded to an unexpectedly small payload. Ensure the secret is the full base64 of the .pfx file."
          exit 1
        }
        [IO.File]::WriteAllBytes("codesign.pfx", $bytes)

    # --------------------------------------------
    # Prepare release files with proper names
    # --------------------------------------------
    - name: Prepare release files
      shell: pwsh
      run: |
        $version = "${{ steps.version.outputs.version }}"
        foreach ($arch in $env:ARCHES.Split(" ")) {
          Copy-Item -Path "Setup/Bean Mod Manager-$arch.msi" -Destination "BeanModManager-$version-$arch-Installer.msi"
          Copy-Item -Path "publish/portable-$arch/BeanModManager.exe" -Destination "BeanModManager-$version-$arch-Portable.exe"
        }
        Get-ChildItem "BeanModManager-*" | Select-Object Name

    # --------------------------------------------
    # Sign all release files
    # --------------------------------------------
    - name: Sign release files
      shell: pwsh
      run: |
        Get-ChildItem "BeanModManager-*" -Include *.msi,*.exe | ForEach-Object {
          Write-Host "Signing $($_.Name)"
          & $env:SIGNTOOL sign `
            /f codesign.pfx `
            /p "${{ secrets.CODESIGN_PASSWORD }}" `
            /fd sha256 `
            /tr http://timestamp.digicert.com `
            /td sha256 `
            $_.FullName
          if ($LASTEXITCODE -ne 0) { Write-Error "Signing failed for $($_.Name)"; exit 1 }
        }

    # --------------------------------------------
    # Get previous tag for changelog
    # --------------------------------------------
    - name: Get previous tag
      shell: pwsh
      id: prev-tag
      run: |
        $currentTag = "v${{ steps.version.outputs.version }}"
        $prevTag = git describe --tags --abbrev=0 "$currentTag^" 2>$null
        if ($LASTEXITCODE -ne 0) {
          $prevTag = git tag --sort=-creatordate | Where-Object { $_ -ne $currentTag } | Select-Object -First 1
        }
        Add-Content -Path $env:GITHUB_OUTPUT -Value "prev-tag=$prevTag"
        Write-Host "Previous tag: $prevTag"

    # --------------------------------------------
    # Generate release notes
    # --------------------------------------------
    - name: Generate release notes
      shell: pwsh
      run: |
        $version = "${{ steps.version.outputs.version }}"
        $prevTag = "${{ steps.prev-tag.outputs.prev-tag }}"

        # Check if there's a release notes file for this version
        $notesFile = "RELEASE_NOTES_$version.md"
        if (Test-Path $notesFile) {
          Write-Host "Using existing release notes file: $notesFile"
          $notes = Get-Content $notesFile -Raw
        } else {
          # Generate from git commits
          Write-Host "Generating release notes from git commits"
          if ($prevTag) {
            $commits = git log --pretty=format:"%s" "$prevTag..HEAD" | Where-Object { $_ -notmatch "^Merge|^chore|^docs" }
            $changelogUrl = "https://github.com/${{ github.repository }}/compare/$prevTag...v$version"
          } else {
            $commits = git log --pretty=format:"%s" -n 50 | Where-Object { $_ -notmatch "^Merge|^chore|^docs" }
            $changelogUrl = "https://github.com/${{ github.repository }}/releases/tag/v$version"
          }

          # Categorize commits
          $added = @()
          $fixed = @()
          foreach ($commit in $commits) {
            if ($commit -match "^(add|feat|new)", "IgnoreCase") {
              $added += "- $commit"
            } elseif ($commit -match "^(fix|bug|patch)", "IgnoreCase") {
              $fixed += "- $commit"
            } else {
              $fixed += "- $commit"
            }
          }

          # Build notes
          $notes = "## Release $version`n`n"
          if ($added.Count -gt 0) {
            $notes += "### Added`n`n"
            $notes += ($added -join "`n") + "`n`n"
          }
          if ($fixed.Count -gt 0) {
            $notes += "### Fixed`n`n"
            $notes += ($fixed -join "`n") + "`n`n"
          }
          $notes += "**Full Changelog**: $changelogUrl`n`n"
          $notes += "Happy modding! ❤️`n"
        }

        $notes | Out-File -FilePath release-notes.md -Encoding utf8
        Write-Host "Release notes generated"

    # --------------------------------------------
    # Cleanup cert
    # --------------------------------------------
    - name: Cleanup cert
      shell: pwsh
      run: Remove-Item codesign.pfx

    # --------------------------------------------
    # Create GitHub Release
    # --------------------------------------------
    - name: Publish Release
      uses: softprops/action-gh-release@v2
      with:
        name: v${{ steps.version.outputs.version }}
        tag_name: v${{ steps.version.outputs.version }}
        body_path: release-notes.md
        files: |
          BeanModManager-*-Installer.msi
          BeanModManager-*-Portable.exe
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
